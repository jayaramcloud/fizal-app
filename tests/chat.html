<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Visitor chat test</title></head><body><h1>Visitor chat test</h1><p id="result">Loading chat script...</p><script>const out=document.getElementById('result'),script=document.createElement('script');script.src=location.hostname==='htmlpreview.github.io'?'https://cdn.jsdelivr.net/gh/jayaramcloud/fizal-app@2f02255/public/chat.js':'../public/chat.js';script.onerror=()=>out.textContent='FAIL: could not load chat.js';script.onload=()=>{try{const panel=document.getElementById('visitor-chat');if(!panel)throw Error('Chat widget is missing');panel.open=true;const form=panel.querySelector('form'),input=panel.querySelector('input');if(input.type!=='text'||!input.required)throw Error('Name must be required first');input.value=' ';form.requestSubmit();if(input.type!=='text'||input.validity.valid)throw Error('Whitespace name accepted');input.value='Alex';input.dispatchEvent(new Event('input'));form.requestSubmit();if(input.type!=='email')throw Error('Email not requested after name');input.value='not-an-email';if(input.checkValidity())throw Error('Invalid email accepted');input.value='alex@example.com';form.requestSubmit();if(!form.hidden||input.value!==''||!panel.textContent.includes('not saved'))throw Error('Demo confirmation or cleanup failed');out.textContent='PASS: name required, whitespace rejected, email requested and validated, demo completed without retaining input';}catch(error){out.textContent='FAIL: '+error.message;}};document.body.append(script);</script></body></html>
